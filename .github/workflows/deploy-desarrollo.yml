name: Continuous Deployment - Rama Desarrollo

on:
  push:
    branches:
      - desarrollo

jobs:
  deploy:
    name: Despliegue en Servidor de Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Copiar archivos al servidor vía SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "."
          target: "/opt/geofull-v4"
          overwrite: true

      - name: Reconstruir y ejecutar contenedores Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /opt/geofull-v4
            echo "Reiniciando servicios Docker para GeoFull V4..."
            if docker compose version >/dev/null 2>&1; then
              CMD="docker compose"
            else
              CMD="docker-compose"
            fi
            $CMD down || true
            $CMD up -d --build
            echo "Estado de los contenedores GeoFull V4:"
            $CMD ps

