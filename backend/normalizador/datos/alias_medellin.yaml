# Alias de vías del Valle de Aburrá -> nomenclatura oficial.
#
# PENDIENTE DE VALIDACIÓN POR EL USUARIO: cambie `validado: true` en cada entrada revisada.
# El motor usa las entradas aunque no estén validadas, pero la confianza baja (ver alias.py).
#
# Campos:
#   nombres:   formas del nombre (minúsculas, sin tildes).
#   prefijos:  palabras que deben ir antes del nombre. Evita falsos positivos como
#              "Medellín Colombia" -> CL 50. Por defecto: PREFIJOS_NOMBRE en alias.py.
#   via:       {tipo, numero, letra?}
#   ambiguo:   true si no hay una única vía equivalente (cambia de número por tramo, etc.).

