version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geofull-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geofull_v4}
      POSTGRES_USER: ${POSTGRES_USER:-geofull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geofull_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geofull} -d ${POSTGRES_DB:-geofull_v4}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geofull-backend
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-geofull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geofull_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-geofull_v4}
      SECRET_KEY: ${SECRET_KEY:-geofull_v4_secret_key_change_in_production_2026}

  # Importador de GPKG catastrales (backend/data/) hacia PostGIS. No arranca con `up`;
  # se ejecuta bajo demanda: docker compose run --rm geo-import
  geo-import:
    image: ghcr.io/osgeo/gdal:ubuntu-small-latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-geofull}
      PGPASSWORD: ${POSTGRES_PASSWORD:-geofull_secure_password_2026}
      PGDATABASE: ${POSTGRES_DB:-geofull_v4}
    volumes:
      - ./backend/data:/data:ro
      - ./backend/scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/importar_catastro.sh"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geofull-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
